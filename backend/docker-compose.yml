version: "3.9"

services:
  db:
    image: mysql:8
    container_name: petrol-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petrol_db
    ports:
      - "3306:3306"

  backend:
    build: .
    container_name: petrol-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db